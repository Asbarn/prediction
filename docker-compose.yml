services:
  prediction:
    image: 606103597377.dkr.ecr.us-east-1.amazonaws.com/prediction:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./config:/app/config
      - ./secrets:/app/secrets:ro
      - ./spread_logs:/app/spread_logs
      - ./settlement_logs:/app/settlement_logs
      - ./paper_trades:/app/paper_trades
      - ./state:/app/state
      - ./logs:/app/logs
    # Kalshi disabled — geo-blocked from Poland account
    environment: []
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

