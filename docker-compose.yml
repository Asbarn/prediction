services:
  prediction:
    image: 606103597377.dkr.ecr.us-east-1.amazonaws.com/prediction:latest
    env_file: .env
    stop_grace_period: 30s
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - /opt/prediction/data/config:/app/config
      - /opt/prediction/data/spread_logs:/app/spread_logs
      - /opt/prediction/data/settlement_logs:/app/settlement_logs
      - /opt/prediction/data/paper_trades:/app/paper_trades
      - /opt/prediction/data/state:/app/state
      - /opt/prediction/data/logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: "no"
  # Prometheus sidecar: scrapes prediction metrics and remote-writes to AMP.
  # In production, prometheus.yml is generated by user-data with AMP workspace ID from SSM.
  # For local dev, create a local prometheus.yml with your own AMP workspace ID or omit remote_write.
  prometheus:
    image: prom/prometheus:v3.10.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=2h'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      prediction:
        condition: service_healthy
    restart: "no"
  # Grafana OSS: self-hosted dashboard for querying AMP metrics.
  # In production, provisioning YAML is generated by user-data for AMP data source with SigV4.
  # For local dev, configure data source manually via Grafana UI.
  grafana:
    image: grafana/grafana-oss:11.5.2
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_SIGV4_AUTH_ENABLED=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: "no"
volumes:
  grafana-data:
