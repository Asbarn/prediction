[deribit]
ws_url = "wss://www.deribit.com/ws/api/v2"
rate_limit_per_second = 20
heartbeat_interval_ms = 10000  # Deribit minimum is 10s
staleness_threshold_ms = 5000  # Data older than 5s marked stale (RELY-03)
instruments = ["BTC-27JUN25-100000-C"]

# Reconnection backoff configuration
[deribit.reconnect]
initial_backoff_ms = 1000      # Start at 1s
max_backoff_ms = 60000         # Cap at 60s
randomization_factor = 0.5     # +/- 50% jitter

[polymarket]
ws_url = "wss://ws-subscriptions-clob.polymarket.com/ws/market"
rest_url = "https://clob.polymarket.com"
chain_id = 137  # Polygon mainnet
gamma_api_url = "https://gamma-api.polymarket.com"
staleness_threshold_ms = 5000
rate_limit_per_second = 10
ping_interval_ms = 10000

# Reconnection backoff configuration
[polymarket.reconnect]
initial_backoff_ms = 1000
max_backoff_ms = 60000
randomization_factor = 0.5

# Example Polymarket assets (placeholder IDs for a sample market)
[[polymarket.assets]]
condition_id = "0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef"
token_id = "71321045679252212594626385532706912750332728571942532289631379312455583992563"

[kalshi]
rest_url = "https://trading-api.kalshi.com/trade-api/v2"
ws_url = "wss://trading-api.kalshi.com/trade-api/ws/v2"
staleness_threshold_ms = 5000
rate_limit_per_second = 10
market_tickers = []
private_key_path = "/app/secrets/kalshi_private_key.pem"

[kalshi.reconnect]
initial_backoff_ms = 1000
max_backoff_ms = 60000
randomization_factor = 0.5
