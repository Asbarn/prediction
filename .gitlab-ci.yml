stages:
  - test
  - build-and-push
  - deploy

variables:
  ECR_REGISTRY: "606103597377.dkr.ecr.us-east-1.amazonaws.com"
  ECR_REPOSITORY: "prediction"
  AWS_DEFAULT_REGION: "us-east-1"

# --- Stage 1: Run tests ---
test:
  stage: test
  image: rust:1.92
  variables:
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  cache:
    key: "cargo-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/
  script:
    - cargo test --release
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

# --- Stage 2: Build Docker image and push to ECR ---
build-and-push:
  stage: build-and-push
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region ${AWS_DEFAULT_REGION}
      | docker login --username AWS --password-stdin ${ECR_REGISTRY}
  script:
    - docker build -t ${ECR_REGISTRY}/${ECR_REPOSITORY}:${CI_COMMIT_SHA} -t ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest .
    - docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${CI_COMMIT_SHA}
    - docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

# --- Stage 3: Deploy to EC2 via SSM ---
deploy:
  stage: deploy
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  script:
    - |
      CMD_ID=$(aws ssm send-command \
        --instance-ids "${EC2_INSTANCE_ID}" \
        --document-name "AWS-RunShellScript" \
        --parameters 'commands=[
          "systemctl stop prediction",
          "cd /opt/prediction && /opt/prediction/fetch-secrets.sh",
          "docker compose pull",
          "systemctl start prediction",
          "sleep 25",
          "for i in 1 2 3 4 5; do curl -sf http://localhost:9001/health && exit 0; sleep 5; done; echo HEALTH CHECK FAILED && exit 1"
        ]' \
        --timeout-seconds 300 \
        --query "Command.CommandId" \
        --output text)

      echo "SSM Command ID: ${CMD_ID}"

      aws ssm wait command-executed \
        --command-id "${CMD_ID}" \
        --instance-id "${EC2_INSTANCE_ID}"

      STDOUT=$(aws ssm get-command-invocation \
        --command-id "${CMD_ID}" \
        --instance-id "${EC2_INSTANCE_ID}" \
        --query "StandardOutputContent" \
        --output text)

      STDERR=$(aws ssm get-command-invocation \
        --command-id "${CMD_ID}" \
        --instance-id "${EC2_INSTANCE_ID}" \
        --query "StandardErrorContent" \
        --output text)

      STATUS=$(aws ssm get-command-invocation \
        --command-id "${CMD_ID}" \
        --instance-id "${EC2_INSTANCE_ID}" \
        --query "Status" \
        --output text)

      echo "--- Command Output ---"
      echo "STDOUT: ${STDOUT}"
      echo "STDERR: ${STDERR}"
      echo "Invocation status: ${STATUS}"

      if [ "${STATUS}" != "Success" ]; then
        echo "Deploy failed with status: ${STATUS}"
        exit 1
      fi

      echo "Deploy succeeded"
  timeout: 10 minutes
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
